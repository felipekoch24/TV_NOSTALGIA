<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessão Nostalgia - TV Aberta</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <div id="aviso" tabindex="0">
        <h1>📺 Sessão Nostalgia</h1>
        <p>Aperte ENTER ou TOQUE na tela para ligar a TV</p>
    </div>

    <div id="carregando">
        <div class="spinner"></div>
        <div id="texto-carregando">Sintonizando Canal (0%)</div>
        <div id="barra-progresso-carregamento">
            <div id="progresso-interno"></div>
        </div>
    </div>

    <video id="player" playsinline webkit-playsinline class="controles-ocultos"></video>

    <script src="script.js"></script>
</body>
</html>
