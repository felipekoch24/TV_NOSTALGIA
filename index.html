<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sessão Nostalgia</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            font-family: Arial, sans-serif; 
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        #aviso { 
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 2rem 4rem; 
            font-size: 2rem; 
            text-align: center;
            background: #8b4513; 
            color: white; 
            border-radius: 16px; 
            z-index: 10;
            outline: 4px solid #ffcc00;
        }
        #player { 
            width: 100vw; 
            height: 100vh; 
            display: none; 
            background: #000;
        }
        .controles-ocultos::-webkit-media-controls {
            display: none !important;
        }
        .controles-ocultos {
            -webkit-appearance: none;
        }
    </style>
</head>
<body>

    <div id="aviso">Aperte ENTER para começar sua SESSÃO NOSTALGIA</div>
    <video id="player" playsinline controls class="controles-ocultos"></video>

    <script>
        const video = document.getElementById('player');
        const aviso = document.getElementById('aviso');
        let hls = null;
        let indice = 0;
        let modo = 'abertura';

        // ✅ Links corretos
        const ANUNCIO_ABERTURA = "https://raw.githubusercontent.com/felipekoch24/TV_NOSTALGIA/main/anuncios/abertura01.m3u8";
        const ANUNCIO_ENTRE = "https://raw.githubusercontent.com/felipekoch24/TV_NOSTALGIA/main/anuncios/anuncio02.m3u8";

        const EPISODIOS = [
            { nome: "🤠 Pica-Pau", url: "https://raw.githubusercontent.com/felipekoch24/TV_NOSTALGIA/main/pica-pau/index.m3u8" },
            { nome: "💪 Popeye Ep01", url: "https://raw.githubusercontent.com/felipekoch24/TV_NOSTALGIA/main/popeye/popeye01.m3u8" }
        ];

        // Função de carregamento
        function carregar(url) {
            if (!url) return;
            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls({ maxBufferSize: 30 * 1000 * 1000 });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
                hls.on(Hls.Events.ERROR, (_, e) => { if (e.fatal) { hls.destroy(); proximo(); } });
            } else {
                video.src = url;
                video.play().catch(() => proximo());
            }
        }

        // Lógica de sequência e loop
        function proximo() {
            if (modo === 'abertura') {
                modo = 'episodio';
                indice = 0;
                carregar(EPISODIOS[indice].url);
            } else if (modo === 'episodio') {
                modo = 'anuncio';
                carregar(ANUNCIO_ENTRE);
            } else if (modo === 'anuncio') {
                modo = 'episodio';
                indice = (indice + 1) % EPISODIOS.length;
                carregar(EPISODIOS[indice].url);
            }
        }

        function anterior() {
            indice = (indice - 1 + EPISODIOS.length) % EPISODIOS.length;
            modo = 'anuncio';
            carregar(ANUNCIO_ENTRE);
        }

        // 🎮 AQUI: ENTER para começar
        document.addEventListener('keydown', (e) => {
            // Se ainda não começou
            if (aviso.style.display !== 'none') {
                if (e.key === 'Enter' || e.keyCode === 13) {
                    aviso.style.display = 'none';
                    video.style.display = 'block';
                    if (video.requestFullscreen) video.requestFullscreen().catch(() => {});
                    modo = 'abertura';
                    carregar(ANUNCIO_ABERTURA);
                }
                return;
            }

            // Controles depois de começar
            e.preventDefault();
            switch(e.keyCode) {
                case 37: anterior(); break;
                case 39: proximo(); break;
                case 38: video.classList.remove("controles-ocultos"); break;
                case 40: video.classList.add("controles-ocultos"); break;
                case 13: case 66:
                    video.paused ? video.play() : video.pause();
                    break;
            }
        });

        // Ao terminar um vídeo, vai para o próximo
        video.addEventListener('ended', proximo);

        window.addEventListener('load', () => aviso.focus());
    </script>
</body>
</html>
