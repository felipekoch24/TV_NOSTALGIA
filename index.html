<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessão Nostalgia</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            font-family: Arial, sans-serif; 
            color: #fff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #aviso { 
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 2rem; 
            font-size: 1.8rem; 
            text-align: center;
            background: #8b4513; 
            color: white; 
            border-radius: 16px; 
            z-index: 10;
            outline: 4px solid #ffcc00;
            cursor: pointer;
            width: 85%;
            max-width: 500px;
        }
        #player { 
            width: 100vw; 
            height: 100vh; 
            display: none; 
            background: #000;
            object-fit: contain;
        }
        .controles-ocultos::-webkit-media-controls {
            display: none !important;
        }
        .controles-ocultos {
            -webkit-appearance: none;
        }
        /* HUD para o Modo Desenvolvedor */
        #dev-hud {
            display: none;
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.85);
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px 14px;
            font-family: monospace;
            font-size: 0.9rem;
            z-index: 20;
            border-radius: 6px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="dev-hud">MODO DEV ATIVO</div>
    <div id="aviso" tabindex="0">Aperte ENTER ou TOQUE na tela para começar</div>
    <video id="player" playsinline webkit-playsinline controls class="controles-ocultos"></video>

    <script>
        const video = document.getElementById('player');
        const aviso = document.getElementById('aviso');
        const devHud = document.getElementById('dev-hud');
        
        let hls = null;
        let indice = 0;
        let modo = 'abertura';
        let iniciado = false;

        // Ativa o Modo Dev se tiver ?dev=true na URL ou se pressionar a tecla 'D'
        const urlParams = new URLSearchParams(window.location.search);
        let MODO_DEV = urlParams.get('dev') === 'true';

        let ANUNCIO_ABERTURA = "";
        let ANUNCIO_ENTRE = "";
        let EPISODIOS = [];

        const URL_PLAYLIST = "https://raw.githubusercontent.com/felipekoch24/TV_NOSTALGIA/main/playlist.json";

        function atualizarHud() {
            if (!MODO_DEV) return;
            devHud.style.display = 'block';
            const nomeEp = EPISODIOS[indice] ? EPISODIOS[indice].nome : '---';
            devHud.innerHTML = `🛠️ <b>MODO DEV</b><br>Modo Atual: ${modo}<br>Episódio [${indice + 1}/${EPISODIOS.length}]: ${nomeEp}<br><br><small>[D] Ativa/Desativa Dev | [S] Pula pra Frente | [A] Volta Ep | [1-9] Pula direto p/ Ep</small>`;
        }

        function embaralhar(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        async function carregarPlaylist() {
            try {
                const resposta = await fetch(URL_PLAYLIST);
                if (!resposta.ok) throw new Error(`HTTP error! status: ${resposta.status}`);
                
                const dados = await resposta.json();
                ANUNCIO_ABERTURA = dados.anuncios.abertura;
                ANUNCIO_ENTRE = dados.anuncios.entre_episodios;
                
                EPISODIOS = dados.episodios;
                // No modo dev mantém a ordem original para facilitar o teste por ID, senão embaralha
                if (!MODO_DEV) {
                    embaralhar(EPISODIOS);
                }
            } catch (erro) {
                console.error("Erro ao carregar o playlist.json:", erro);
            }
        }

        function carregar(url) {
            if (!url) return;
            atualizarHud();

            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                if (hls) { hls.destroy(); hls = null; }
                video.src = url;
                video.play().catch(() => proximo());
            } 
            else if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls({ maxBufferSize: 30 * 1000 * 1000, enableWorker: true });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
                hls.on(Hls.Events.ERROR, (_, e) => { if (e.fatal) { hls.destroy(); proximo(); } });
            } else {
                video.src = url;
                video.play().catch(() => proximo());
            }
        }

        function proximo() {
            if (EPISODIOS.length === 0) return;

            if (modo === 'abertura') {
                modo = 'episodio';
                indice = 0;
                carregar(EPISODIOS[indice].url);
            } else if (modo === 'episodio') {
                modo = 'anuncio';
                carregar(ANUNCIO_ENTRE);
            } else if (modo === 'anuncio') {
                modo = 'episodio';
                indice++;
                if (indice >= EPISODIOS.length) {
                    if (!MODO_DEV) embaralhar(EPISODIOS);
                    indice = 0;
                }
                carregar(EPISODIOS[indice].url);
            }
        }

        function anterior() {
            if (EPISODIOS.length === 0) return;
            indice = (indice - 1 + EPISODIOS.length) % EPISODIOS.length;
            modo = 'anuncio';
            carregar(ANUNCIO_ENTRE);
        }

        function iniciarSessao() {
            if (iniciado || !ANUNCIO_ABERTURA) return;
            iniciado = true;

            aviso.style.display = 'none';
            video.style.display = 'block';

            if (video.requestFullscreen) {
                video.requestFullscreen().catch(() => {});
            } else if (video.webkitRequestFullscreen) {
                video.webkitRequestFullscreen().catch(() => {});
            }

            modo = 'abertura';
            carregar(ANUNCIO_ABERTURA);
        }

        aviso.addEventListener('click', iniciarSessao);
        aviso.addEventListener('touchstart', (e) => {
            e.preventDefault();
            iniciarSessao();
        });

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            const code = e.keyCode;

            // Atalho universal para ativar/desativar MODO DEV a qualquer momento
            if (key === 'd' || key === 'D') {
                MODO_DEV = !MODO_DEV;
                devHud.style.display = MODO_DEV ? 'block' : 'none';
                atualizarHud();
                return;
            }

            // ATALHOS EXCLUSIVOS DO MODO DEV
            if (MODO_DEV) {
                // Tecla S: Força pular a mídia atual imediatamente (anúncio ou episódio)
                if (key === 's' || key === 'S') {
                    proximo();
                    return;
                }
                // Tecla A: Força voltar para o episódio anterior
                if (key === 'a' || key === 'A') {
                    modo = 'episodio';
                    indice = (indice - 1 + EPISODIOS.length) % EPISODIOS.length;
                    carregar(EPISODIOS[indice].url);
                    return;
                }
                // Teclas de 1 a 9: Pula diretamente para o número do episódio correspondente
                if (key >= '1' && key <= '9') {
                    const num = parseInt(key) - 1;
                    if (num < EPISODIOS.length) {
                        modo = 'episodio';
                        indice = num;
                        carregar(EPISODIOS[indice].url);
                    }
                    return;
                }
            }

            if (!iniciado) {
                if (key === 'Enter' || code === 13 || code === 66) {
                    iniciarSessao();
                }
                return;
            }

            // CONTROLES PADRÃO (USUÁRIO)
            if (key === 'ArrowLeft' || code === 37 || code === 227) {
                e.preventDefault();
                anterior();
            } 
            else if (key === 'ArrowRight' || code === 39 || code === 228) {
                e.preventDefault();
                proximo();
            } 
            else if (key === 'ArrowUp' || code === 38) {
                e.preventDefault();
                video.classList.remove("controles-ocultos");
            } 
            else if (key === 'ArrowDown' || code === 40) {
                e.preventDefault();
                video.classList.add("controles-ocultos");
            } 
            else if (key === 'Enter' || code === 13 || code === 66 || code === 179) {
                e.preventDefault();
                video.paused ? video.play() : video.pause();
            }
        });

        video.addEventListener('ended', proximo);

        window.addEventListener('load', () => {
            carregarPlaylist();
            aviso.focus();
        });
    </script>
</body>
</html>
